name: Installer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the official R85 Compose configuration
        shell: bash
        run: |
          git clone --depth 1 --branch r85 https://github.com/ar-io/ar-io-node "$RUNNER_TEMP/ar-io-r85"
          test "$(git -C "$RUNNER_TEMP/ar-io-r85" rev-parse HEAD)" = 6c7006d530355c8f07240e28bebac5c9f6c71b7d
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' > "$RUNNER_TEMP/compose-config"
          chmod +x "$RUNNER_TEMP/compose-config"
          echo "ARIO_UPSTREAM_COMPOSE=$RUNNER_TEMP/ar-io-r85/docker-compose.yaml" >> "$GITHUB_ENV"
          echo "ARIO_COMPOSE_BIN=$RUNNER_TEMP/compose-config" >> "$GITHUB_ENV"
      - name: Validate scripts and configuration without starting services
        run: |
          bash -n install-gateway.sh update-tools.sh
          python3 -m unittest discover -s tests -v
